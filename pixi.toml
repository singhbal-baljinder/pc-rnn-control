# pixi install && pixi run build-lwpr && pixi run figures
[workspace]
name = "pc-rnn-control"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.15"
# toolchain for the LWPR baseline
cmake = "*"
make = "*"
c-compiler = "*"
cxx-compiler = "*"
expat = "*"

[pypi-dependencies]
pc-rnn-control = { path = ".", editable = true }
# CPU build: nothing here needs CUDA
torch = { version = ">=2.2", index = "https://download.pytorch.org/whl/cpu" }

[tasks]
build-lwpr = """
mkdir -p third_party/lwpr/build &&
cd third_party/lwpr/build &&
cmake .. -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DNUM_THREADS=1 &&
make -j &&
make install &&
python -c 'import pylwpr; print("pylwpr OK:", pylwpr.LWPR(2, 1))'
"""
figures = "python scripts/make_figures.py"
openloop = "python scripts/run_openloop_sweep.py"
verify = "python -c 'import pc_rnn_control, pylwpr; print(\"environment complete\")'"
